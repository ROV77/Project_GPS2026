server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Sin URI al final de proxy_pass: nginx reenvía la request tal cual
        # (con el prefijo /api incluido). La API monta sus rutas bajo
        # app.use('/api', ...), igual que el proxy de Vite en dev — si acá se
        # le agrega un "/" al final, nginx pela el prefijo y todo responde 404.
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
