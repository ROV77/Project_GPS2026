services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - apps/api/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api

  # Único punto de entrada público: expone `web` (que a su vez proxea /api al
  # contenedor `api`) por HTTPS, sin necesitar que 80/443 sean alcanzables
  # desde fuera de la red/VPN de la universidad — el túnel lo abre este
  # contenedor hacia afuera. ngrok termina el TLS por su cuenta (sin Certbot).
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: http web:80 --url=https://${NGROK_DOMAIN}
    depends_on:
      - web
