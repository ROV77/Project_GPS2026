name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    name: "Verificar tipos (tsc)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Verificar tipos
        run: pnpm -r lint

  test:
    name: "Ejecutar pruebas (Jest)"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: caseritadb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/caseritadb?schema=public"

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Cargar esquema en Postgres
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d caseritadb -f docs/caseritapp_schema.sql

      - name: Generar Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Ejecutar tests
        run: pnpm -r test

  ci-success:
    name: "CI Completado"
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Notificar éxito
        run: echo "El pipeline de CI ha pasado con éxito. Código limpio y probado."
